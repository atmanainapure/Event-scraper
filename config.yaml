# Event bot configuration. The bot reads this on every run.
#
# Every morning (8 AM New York time):
#   1. Find hackathons and networking events on Luma, Meetup and Cerebral Valley.
#   2. Keep networking events that help with a tech internship or a strong network.
#   3. Keep only events involving one of the top companies below.
#   4. If none of those is a hackathon, Google "<company> hackathon New York City"
#      for every company and add what it finds as leads.
#   5. Email it all.

# How far ahead to look for events (days).
lookahead_days: 90

# The top tech / AI companies. An event counts if its title, host or description
# mentions the name or one of the aliases (whole words, any case).
top_companies:
  - {name: Google, aliases: [Gemini, DeepMind, Google Cloud, GCP, Google Developer, GDG, Google for Startups]}
  - {name: Amazon, aliases: [AWS, Amazon Web Services, Bedrock]}
  - {name: Meta, aliases: [Facebook, Llama, Instagram, WhatsApp, Meta AI]}
  - {name: Apple, aliases: [WWDC, Apple Developer]}
  - {name: Microsoft, aliases: [Azure, GitHub, Copilot, Microsoft Reactor]}
  - {name: NVIDIA, aliases: [CUDA, NVIDIA Inception]}
  - {name: OpenAI, aliases: [ChatGPT, GPT-5, Codex]}
  - {name: Anthropic, aliases: [Claude]}

# Step 4: Google search, one query per company. Needs a SERPAPI_KEY secret
# (or GOOGLE_API_KEY + GOOGLE_CSE_ID). Set always: true to search every day,
# not only when no top-company hackathon was found.
google_fallback:
  query: "{company} hackathon New York City"
  always: false

# Only keep in-person events in these places (matched against location,
# title and description).
locations: [nyc, new york, manhattan, brooklyn, queens, long island city, astoria,
  new jersey, nj, jersey city, hoboken, newark, princeton, new brunswick, montclair]

# A networking event is kept only if it mentions one of these, i.e. it can
# help you get a tech internship or meet people in tech (regex, any case).
networking_relevance: "\\b(tech|ai|ml|llm|startups?|founders?|engineer(s|ing)?|developers?|devs?|software|coding|data|product|design|career|recruit(ing|er|ers)?|hiring|interns?|internships?|vcs?|venture|investors?|builders?|hackers?|cloud|machine learning|genai|agents?)\\b"

# What counts as a hackathon / networking event (matched against title + description).
keywords:
  hackathon: [hackathon, hack night, hack day, buildathon, build night, build day, hack week, "hack-a-thon", codefest]
  networking: [networking, mixer, happy hour, meetup, meet-up, social, founders night, demo night, demo day,
    "drinks", "afterparty", "after party", "community night", "fireside", "career fair", "coffee chat",
    "office hours", "meet the team", "panel", "summit", "conference", "devday", "dev day", "user group"]

# --- Sources -----------------------------------------------------------------

# Luma pages: the NYC city page plus the AI and tech categories (NYC events only).
luma:
  pages: [nyc, ai, tech]
  search_terms: []

# Meetup search (meetup.com/find) around New York.
meetup:
  location: "us--ny--New York"
  keywords: [hackathon, tech networking, AI, startup networking, software engineering, developers]

# Cerebral Valley hosts events on its own site: the listing is read, then each event page.
event_platforms:
  - {name: Cerebral Valley, url: "https://cerebralvalley.ai/events", link_pattern: "/e/"}
