# Event bot configuration. Edit freely; the bot reads this on every run.

# How far ahead to look for events (days).
lookahead_days: 90

# Send an email even when nothing new was found (so you know the bot is alive).
email_when_empty: true

# Only keep events in these places. Matched (case-insensitive, whole words)
# against the event's location, title and description. Events with no
# recognizable location, and online events, are dropped. Remove this block
# to get events from everywhere again.
locations:
  - nyc
  - new york
  - manhattan
  - brooklyn
  - queens
  - long island city
  - astoria
  - new jersey
  - nj
  - jersey city
  - hoboken
  - newark
  - princeton
  - new brunswick
  - montclair

# What the daily email contains.
#   top_hackathons: only the top_n hackathons, ranked by internship-networking ROI
#   digest:         every new hackathon, mixer, meetup and conference (old behaviour)
email:
  mode: top_hackathons
  top_n: 5

# How hackathons are ranked. With an ANTHROPIC_API_KEY secret, Claude ranks them
# using `profile`; otherwise a point score based on target_companies, recruiting
# keywords, student focus, size and prizes is used.
ranking:
  profile: >-
    University student in New York City looking for a software engineering / AI
    internship. Wants to meet engineers and recruiters from strong tech, AI and
    finance companies.
  target_companies: [Google, Meta, Amazon, AWS, Apple, Microsoft, Netflix, NVIDIA, OpenAI,
    Anthropic, MongoDB, Neo4j, Databricks, Snowflake, Datadog, Stripe, Ramp, Plaid, Brex,
    Bloomberg, Jane Street, Two Sigma, Citadel, Hudson River Trading, D. E. Shaw, Goldman Sachs,
    JPMorgan, Morgan Stanley, Capital One, IBM, Palantir, Scale AI, Cohere, Hugging Face, Vercel,
    Cloudflare, Notion, Figma, Spotify, Etsy, Squarespace, Pinecone, Weaviate, LangChain,
    Y Combinator, a16z, Microsoft Reactor, Google Cloud]

# Sites that host events on their own pages. The listing `url` is read, then
# every link containing `link_pattern` is opened to get title, date and place.
event_platforms:
  - {name: Cerebral Valley, url: "https://cerebralvalley.ai/events", link_pattern: "/e/"}

# Dedicated hackathon sources.
hackathon_sources:
  # Google Events results (needs a SERPAPI_KEY secret; ~2 searches/day).
  google_events_queries:
    - hackathon New York City
    - hackathon New Jersey
  # Regular Google results (SERPAPI_KEY, or GOOGLE_API_KEY + GOOGLE_CSE_ID).
  google_queries:
    - in-person hackathon NYC
  # Devpost in-person hackathons (no key needed).
  devpost_queries:
    - New York
    - NYC
    - New Jersey
  # Major League Hacking student hackathons (no key needed).
  mlh: true

# What counts as an interesting event. Matched case-insensitively against
# the event title and description.
keywords:
  hackathon: [hackathon, hack night, hack day, buildathon, build night, build day, hack week, "hack-a-thon", codefest, game jam]
  networking: [networking, mixer, happy hour, meetup, meet-up, social, founders night, demo night, demo day, "drinks", "afterparty", "after party", "community night", "fireside"]
  conference: [summit, conference, devday, dev day, world tour, "local", roadshow, "user group", forum, expo]

# ---------------------------------------------------------------------------
# Luma. Each entry is a luma.com page: a city ("sf", "nyc"), a category
# ("ai", "tech") or any calendar slug (e.g. a company's Luma calendar).
# Luma events are only kept if they match one of the keywords above, and
# networking events must be in person.
# ---------------------------------------------------------------------------
luma:
  pages:
    - nyc
    - ai
    - tech
  # Luma has no public search page (luma.com/search 404s, its search API needs
  # a login), so keyword matching on the pages above is used instead.
  search_terms: []

# ---------------------------------------------------------------------------
# Company event pages. `url` is scraped every day. `linkedin` is the company's
# LinkedIn slug (linkedin.com/company/<slug>/events) and is included in the
# email as a one-click link (LinkedIn blocks automated scraping, see README).
# Companies listed with only `linkedin` still show up in the quick-links list.
# ---------------------------------------------------------------------------
companies:
  # FAANG / big tech
  - {name: Google, url: "https://developers.google.com/events", linkedin: google}
  - {name: Google Cloud, url: "https://cloud.google.com/events", linkedin: google-cloud}
