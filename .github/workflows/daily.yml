name: Daily event digest

# The 8 AM New York email is started by a scheduled task that presses "Run workflow"
# (workflow_dispatch) at 7:54 AM ET, because GitHub's own cron often starts hours late.
# The cron below is only a backup: it sends nothing if today's email already went out.
on:
  schedule:
    - cron: "37 14 * * *" # backup, ~9:37 AM EST / 10:37 AM EDT
  workflow_dispatch: # "Run workflow" button
    inputs:
      check_url:
        description: "Debug: explain whether this one event URL would be emailed (sends nothing)"
        type: string
        default: ""

permissions:
  contents: write # to commit data/ (events already emailed, last send date)

concurrency:
  group: event-bot
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape and email
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          CHECK_URL: ${{ inputs.check_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          export SMTP_HOST="${SMTP_HOST:-smtp.gmail.com}"
          export SMTP_PORT="${SMTP_PORT:-465}"
          if [ -n "$CHECK_URL" ]; then python -m event_bot --check-url "$CHECK_URL"; exit 0; fi
          if [ "$EVENT_NAME" = "schedule" ]; then python -m event_bot --skip-if-sent; else python -m event_bot; fi

      - name: Save digest for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remember emailed events
        run: |
          git config user.name "event-bot"
          git config user.email "event-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update seen events [skip ci]"
          git push
